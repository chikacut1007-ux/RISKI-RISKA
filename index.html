        button {
            border: none;

            border-radius: 30px;

            color: white;

        }

        #bride {

        }

        #rsvp {

        #closing {

        /* FORM */

            padding: 13px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;

        textarea {
            min-height: 100px;
            resize: none;

        /* NAVIGATION */

        .navigation {
            position: fixed;

            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(255,255,255,0.9);
            padding: 8px;

        .navigation button {

    <script>

        /* ====================
           BUKA UNDANGAN
        ==================== */

        function openInvitation() {

            const music =
                document.getElementById("backgroundMusic");

            music.play().catch(function(error) {
                console.log("Musik belum bisa autoplay:", error);
            });

            goTo("opening");
        }


        /* ====================
           NAVIGASI
        ==================== */

        function goTo(sectionId) {

            const section =
                document.getElementById(sectionId);

            if (section) {

                section.scrollIntoView({
                    behavior: "smooth"
                });

            }

        }


        /* ====================
           MUSIC
        ==================== */

        function toggleMusic() {

            const music =
                document.getElementById("backgroundMusic");

            const button =
                document.getElementById("musicButton");

            if (music.paused) {

                music.play();

                button.innerHTML = "⏸";

            } else {

                music.pause();

                button.innerHTML = "♪";

            }

        }


        /* ====================

        const params =
            new URLSearchParams(

            );

            params.get("to");


        if (guest) {

                decodeURIComponent(guest);

            document.getElementById("guestName")
                .innerText = decodedGuest;

            document.getElementById("rsvpName")
                .value = decodedGuest;

        }
